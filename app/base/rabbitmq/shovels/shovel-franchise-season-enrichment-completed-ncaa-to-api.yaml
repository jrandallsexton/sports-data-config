apiVersion: rabbitmq.com/v1beta1
kind: Shovel
metadata:
  name: shovel-franchise-season-enrichment-completed-ncaa-to-api
  namespace: messaging
spec:
  name: shovel-franchise-season-enrichment-completed-ncaa-to-api
  uriSecret:
    name: shovel-football-ncaa-to-api-credentials
  # FranchiseSeasonEnrichmentCompleted: the Producer re-derived a team's
  # record (weekly job or the admin action on the team page). The API
  # corrects and evicts the league matchup cards that show that record.
  # Same exchange name on every sport broker; only the broker pair changes.
  srcExchange: "SportsData.Core.Eventing.Events.Franchise:FranchiseSeasonEnrichmentCompleted"
  srcExchangeKey: ""
  destExchange: "SportsData.Core.Eventing.Events.Franchise:FranchiseSeasonEnrichmentCompleted"
  ackMode: "on-confirm"
  srcPrefetchCount: 1000
  rabbitmqClusterReference:
    name: rabbitmq-api
    namespace: messaging
