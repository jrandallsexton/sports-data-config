# BasicAuth middleware for RedisInsight at caching.sportdeets.com.
#
# RedisInsight has NO built-in authentication or accounts (by design - it is a
# local dev tool); the vendor-recommended pattern for network exposure is
# exactly this: auth at the reverse proxy. Same shape as the Hangfire jobs
# dashboard.
#
# The referenced secret must be created manually (NOT committed to git):
#
#   htpasswd -nb admin <yourpassword> | kubectl create secret generic \
#     redisinsight-auth-secret \
#     --from-file=users=/dev/stdin \
#     -n default
#
# Or on Windows (PowerShell):
#   $hash = & htpasswd -nb admin <yourpassword>
#   kubectl create secret generic redisinsight-auth-secret `
#     --from-literal=users="$hash" -n default
#
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: redisinsight-auth
  namespace: default
spec:
  basicAuth:
    secret: redisinsight-auth-secret
