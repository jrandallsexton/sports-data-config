apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: provider-baseball-mlb-worker-scaler
  namespace: default
  annotations:
    # Toggle paused: "true" + add paused-replicas: "0" to halt scaling.
    # KEDA treats paused-replicas as authoritative even when
    # paused: "false", so it MUST be removed (NOT left at "0") to
    # resume normal scaling — that's the gotcha that bit us on
    # 2026-04-25.
spec:
  scaleTargetRef:
    name: provider-baseball-mlb-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 4
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Up fast; down after 10 sustained quiet minutes, 1 pod / 5 min -
        # a terminating pod abandons in-flight Hangfire jobs. Rationale:
        # producer/scaledobject-football-ncaa.yaml.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        # Outstanding work = unclaimed + in-flight, ALL queues (live
        # sourcing rides the sticky '00-live' queue). Full rationale:
        # producer/scaledobject-football-ncaa.yaml.
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE (fetchedat IS NULL
             OR fetchedat > now() - interval '5 minutes')
        targetQueryValue: "30"
        activationTargetQueryValue: "1"
      authenticationRef:
        name: provider-mlb-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: provider-mlb-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: provider-mlb-hangfire-pg-params
      key: host
    - parameter: port
      name: provider-mlb-hangfire-pg-params
      key: port
    - parameter: userName
      name: provider-mlb-hangfire-pg-params
      key: username
    - parameter: password
      name: provider-mlb-hangfire-pg-params
      key: password
    - parameter: dbName
      name: provider-mlb-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: provider-mlb-hangfire-pg-params
      key: sslmode
