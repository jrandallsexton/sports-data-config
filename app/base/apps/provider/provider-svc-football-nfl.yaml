apiVersion: v1
kind: Service
metadata:
  name: provider-svc-football-nfl
  namespace: default
  labels:
    app: provider-football-nfl-api
spec:
  selector:
    app: provider-football-nfl-api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
# Headless Service for Worker pods — enables Prometheus ServiceMonitor discovery
apiVersion: v1
kind: Service
metadata:
  name: provider-football-nfl-worker-metrics
  namespace: default
  labels:
    app: provider-football-nfl-worker
spec:
  selector:
    app: provider-football-nfl-worker
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  clusterIP: None
---
# Headless Service for Ingest pods - Prometheus ServiceMonitor discovery.
# The MassTransit consumers (DocumentRequestedHandler / DocumentCreatedHandler)
# run in the Ingest role, so the intake counters added in sports-data #731
# (provider.documents.requested / documents.received) are emitted HERE -
# without this Service the ingest role was never scraped and those series
# never reached Prometheus. Mirrors the worker-metrics Service.
apiVersion: v1
kind: Service
metadata:
  name: provider-football-nfl-ingest-metrics
  namespace: default
  labels:
    app: provider-football-nfl-ingest
spec:
  selector:
    app: provider-football-nfl-ingest
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  clusterIP: None
