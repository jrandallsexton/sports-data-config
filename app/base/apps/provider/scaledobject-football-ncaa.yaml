apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: provider-football-ncaa-worker-scaler
  namespace: default
  annotations:
spec:
  scaleTargetRef:
    name: provider-football-ncaa-worker
  pollingInterval: 15    # Check every 15 seconds
  cooldownPeriod: 300    # Wait 5 min before scaling down
  minReplicaCount: 1
  maxReplicaCount: 8     # Raised 4->8 2026-09-05: 72k backlog mid full-slate
                         # Saturday with the scaler pinned at 4. ESPN-side
                         # request rate is governed by the token bucket, not
                         # by pod count.
  fallback:
    failureThreshold: 3  # After 3 consecutive trigger query failures, hold replicas
    replicas: 8          # Track max: a trigger blip during live games must
                         # hold at full drain speed, not half.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Up fast; down after 10 sustained quiet minutes, 1 pod / 5 min -
        # a terminating pod abandons in-flight Hangfire jobs. Rationale:
        # producer/scaledobject-football-ncaa.yaml.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        # Outstanding work = unclaimed + in-flight, ALL queues (live
        # sourcing rides the sticky '00-live' queue). Full rationale:
        # producer/scaledobject-football-ncaa.yaml.
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE (fetchedat IS NULL
             OR fetchedat > now() - interval '5 minutes')
        targetQueryValue: "30"                # Scale up if >30 jobs per pod
        activationTargetQueryValue: "1"       # Scale from minReplicas if any jobs
      authenticationRef:
        name: provider-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: provider-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: provider-hangfire-pg-params
      key: host
    - parameter: port
      name: provider-hangfire-pg-params
      key: port
    - parameter: userName
      name: provider-hangfire-pg-params
      key: username
    - parameter: password
      name: provider-hangfire-pg-params
      key: password
    - parameter: dbName
      name: provider-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: provider-hangfire-pg-params
      key: sslmode
