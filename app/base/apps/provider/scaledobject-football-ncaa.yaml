apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: provider-football-ncaa-worker-scaler
  namespace: default
  annotations:
spec:
  scaleTargetRef:
    name: provider-football-ncaa-worker
  pollingInterval: 15    # Check every 15 seconds
  cooldownPeriod: 300    # Wait 5 min before scaling down
  minReplicaCount: 1
  maxReplicaCount: 12    # 8->12 same evening: 8 pods held ~45k live-queue at
                         # peak concurrency, p50 job age 6.5 min = play-by-play
                         # minutes stale in primetime. Raised 4->8 earlier for
                         # the 72k afternoon backlog.
                         # Saturday with the scaler pinned at 4. ESPN-side
                         # request rate is governed by the token bucket, not
                         # by pod count.
  fallback:
    failureThreshold: 3  # After 3 consecutive trigger query failures, hold replicas
    replicas: 12         # Track max: a trigger blip during live games must
                         # hold at full drain speed, not half.
  triggers:
    - type: postgresql
      metadata:
        # Query Hangfire database for pending jobs
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE fetchedat IS NULL
        targetQueryValue: "30"                # Scale up if >30 jobs per pod
        activationTargetQueryValue: "1"       # Scale from minReplicas if any jobs
      authenticationRef:
        name: provider-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: provider-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: provider-hangfire-pg-params
      key: host
    - parameter: port
      name: provider-hangfire-pg-params
      key: port
    - parameter: userName
      name: provider-hangfire-pg-params
      key: username
    - parameter: password
      name: provider-hangfire-pg-params
      key: password
    - parameter: dbName
      name: provider-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: provider-hangfire-pg-params
      key: sslmode
