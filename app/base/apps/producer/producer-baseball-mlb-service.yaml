apiVersion: v1
kind: Service
metadata:
  name: producer-svc-baseball-mlb
  namespace: default
  labels:
    app: producer-baseball-mlb-api
spec:
  selector:
    app: producer-baseball-mlb-api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
# Headless Service for Worker pods — enables Prometheus ServiceMonitor discovery
apiVersion: v1
kind: Service
metadata:
  name: producer-baseball-mlb-worker-metrics
  namespace: default
  labels:
    app: producer-baseball-mlb-worker
spec:
  selector:
    app: producer-baseball-mlb-worker
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  clusterIP: None
---
# Headless Service for Ingest pods - Prometheus ServiceMonitor discovery.
# The MassTransit consumers (DocumentRequestedHandler / DocumentCreatedHandler)
# run in the Ingest role, so the intake counters added in sports-data #731
# (provider.documents.requested / documents.received) are emitted HERE -
# without this Service the ingest role was never scraped and those series
# never reached Prometheus. Mirrors the worker-metrics Service.
apiVersion: v1
kind: Service
metadata:
  name: producer-baseball-mlb-ingest-metrics
  namespace: default
  labels:
    app: producer-baseball-mlb-ingest
spec:
  selector:
    app: producer-baseball-mlb-ingest
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
  clusterIP: None
