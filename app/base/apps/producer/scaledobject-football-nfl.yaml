apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: producer-football-nfl-worker-scaler
  namespace: default
  annotations:
spec:
  scaleTargetRef:
    name: producer-football-nfl-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 4
  fallback:
    failureThreshold: 3
    replicas: 4  # In-season: a trigger blip holds at max, not the floor
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Up fast; down after 10 sustained quiet minutes, 1 pod / 5 min -
        # a terminating pod abandons in-flight Hangfire jobs. Rationale:
        # producer/scaledobject-football-ncaa.yaml.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        # Outstanding work = unclaimed + in-flight, ALL queues (live
        # sourcing rides the sticky '00-live' queue). Full rationale:
        # producer/scaledobject-football-ncaa.yaml.
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE (fetchedat IS NULL
             OR fetchedat > now() - interval '5 minutes')
        targetQueryValue: "30"
        activationTargetQueryValue: "1"
      authenticationRef:
        name: producer-nfl-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: producer-nfl-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: producer-nfl-hangfire-pg-params
      key: host
    - parameter: port
      name: producer-nfl-hangfire-pg-params
      key: port
    - parameter: userName
      name: producer-nfl-hangfire-pg-params
      key: username
    - parameter: password
      name: producer-nfl-hangfire-pg-params
      key: password
    - parameter: dbName
      name: producer-nfl-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: producer-nfl-hangfire-pg-params
      key: sslmode
