apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: producer-football-ncaa-worker-scaler
  namespace: default
  annotations:
spec:
  scaleTargetRef:
    name: producer-football-ncaa-worker
  pollingInterval: 15    # Check every 15 seconds
  cooldownPeriod: 300    # Wait 5 min before scaling down
  # In-season baseline: never fall below 2. One pod is not a floor, it is a
  # single point of failure - a rolling deploy or a node eviction leaves the
  # default queue with zero consumers, and a cold pod takes ~20s to pass
  # readiness. Two keeps the queue drained through any single-pod event.
  minReplicaCount: 2
  maxReplicaCount: 4
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Scale up fast - a real backlog should be met immediately.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
        # Scale down slowly and one pod at a time. Hangfire jobs are long-lived
        # and a terminating pod abandons whatever it was mid-way through, so
        # shedding a pod is expensive and must never be done on a brief dip.
        # 10 minutes of sustained low demand, then one pod per 5 minutes.
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        # Outstanding work on the default queue = unclaimed + in-flight.
        #
        # This deliberately does NOT filter on `fetchedat IS NULL`. Counting only
        # unclaimed rows made the metric blind exactly when the fleet was busiest:
        # 4 pods x 30 workers claim rows as fast as they arrive, so the visible
        # depth collapsed toward zero while 120 jobs were still executing, and the
        # 15s poll sampled that trough and scaled the deployment to its floor.
        #
        # Hangfire deletes a jobqueue row on completion, so an unfiltered count is
        # true outstanding work. The fetchedat clause bounds the other direction:
        # rows claimed by a pod that died are ignored once they age past the
        # invisibility window, rather than pinning the metric high forever.
        #
        # With this signal, targetQueryValue 30 reads as "one pod's 30 workers are
        # saturated" - which is the control the replica count actually wants.
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE queue = 'default'
            AND (fetchedat IS NULL OR fetchedat > now() - interval '5 minutes')
        targetQueryValue: "30"                # 30 outstanding jobs per pod = saturated
        activationTargetQueryValue: "1"       # Scale from minReplicas if any jobs
      authenticationRef:
        name: producer-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: producer-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: producer-hangfire-pg-params
      key: host
    - parameter: port
      name: producer-hangfire-pg-params
      key: port
    - parameter: userName
      name: producer-hangfire-pg-params
      key: username
    - parameter: password
      name: producer-hangfire-pg-params
      key: password
    - parameter: dbName
      name: producer-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: producer-hangfire-pg-params
      key: sslmode
