apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: producer-football-ncaa-worker-scaler
  namespace: default
  annotations:
    # 2026-08-29 pin REMOVED 2026-09-06: the metric now counts in-flight
    # work and the HPA behavior block prevents the trough-sampling thrash
    # the pin guarded against (observed 4->1->4 twelve seconds apart).
spec:
  scaleTargetRef:
    name: producer-football-ncaa-worker
  pollingInterval: 15    # Check every 15 seconds
  cooldownPeriod: 300    # Wait 5 min before scaling down
  # In-season baseline: never fall below 2. One pod is not a floor, it is a
  # single point of failure - a rolling deploy or a node eviction leaves the
  # default queue with zero consumers, and a cold pod takes ~20s to pass
  # readiness. Two keeps the queue drained through any single-pod event.
  minReplicaCount: 2
  maxReplicaCount: 4
  fallback:
    failureThreshold: 3  # After 3 consecutive trigger query failures, hold replicas
    replicas: 4          # In-season: a trigger blip holds at max, not the floor
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Up fast - a real backlog is met immediately.
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 60
        # Down slowly, one pod at a time: a terminating pod abandons its
        # in-flight Hangfire jobs (requeued via invisibility timeout), so
        # shedding capacity on a brief dip manufactures backlog. Ten
        # sustained quiet minutes, then one pod per five minutes.
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        # Outstanding work = unclaimed + in-flight, across ALL queues
        # (live sourcing rides the sticky '00-live' priority queue -
        # filtering to 'default' left KEDA blind to 46k live jobs on
        # 2026-09-05). `fetchedat IS NULL` alone goes blind exactly when
        # the fleet is busiest: workers claim rows as fast as they
        # arrive, the visible depth collapses to ~0, and the 15s poll
        # samples the trough and scales to the floor mid-slate. Hangfire
        # deletes the row on completion, so the unfiltered count is true
        # outstanding work; the age bound ignores claims orphaned by
        # dead pods once they pass the invisibility window. With this
        # signal, targetQueryValue 30 reads as "one pod's 30 workers are
        # saturated" - the control the replica count actually wants.
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE (fetchedat IS NULL
             OR fetchedat > now() - interval '5 minutes')
        targetQueryValue: "30"                # 30 outstanding jobs per pod = saturated
        activationTargetQueryValue: "1"       # Scale from minReplicas if any jobs
      authenticationRef:
        name: producer-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: producer-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: producer-hangfire-pg-params
      key: host
    - parameter: port
      name: producer-hangfire-pg-params
      key: port
    - parameter: userName
      name: producer-hangfire-pg-params
      key: username
    - parameter: password
      name: producer-hangfire-pg-params
      key: password
    - parameter: dbName
      name: producer-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: producer-hangfire-pg-params
      key: sslmode
