apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: producer-football-ncaa-worker-scaler
  namespace: default
  annotations:
    # 2026-08-29 IN-SEASON PIN. The trigger query below counts only *unclaimed*
    # jobs, so 4 pods x 30 workers drain the visible queue to ~0 while 120 jobs
    # are still executing; KEDA's 15s poll samples the trough and scales 4 -> 1,
    # then back to 4 seconds later (observed 4->1 and 1->4 twelve seconds apart).
    # Each cycle kills pods mid-job (ShutdownTimeout 90s), abandoning work that
    # is requeued on invisibility timeout - the thrash manufactures its own
    # backlog. Pinned at max for game day. REMOVE once the metric + behavior
    # fixes land; see the scaler-thrash PR.
    autoscaling.keda.sh/paused-replicas: "4"
spec:
  scaleTargetRef:
    name: producer-football-ncaa-worker
  pollingInterval: 15    # Check every 15 seconds
  cooldownPeriod: 300    # Wait 5 min before scaling down
  # In-season baseline: never fall below 2. One pod is not a floor, it is a
  # single point of failure - a rolling deploy or a node eviction leaves the
  # default queue with zero consumers, and a cold pod takes ~20s to pass
  # readiness. Two keeps the queue drained through any single-pod event.
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
    - type: postgresql
      metadata:
        # Query Hangfire database for pending jobs
        query: >-
          SELECT COUNT(*)::int
          FROM hangfire.jobqueue
          WHERE fetchedat IS NULL
        targetQueryValue: "30"                # Scale up if >30 jobs per pod
        activationTargetQueryValue: "1"       # Scale from minReplicas if any jobs
      authenticationRef:
        name: producer-hangfire-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: producer-hangfire-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: producer-hangfire-pg-params
      key: host
    - parameter: port
      name: producer-hangfire-pg-params
      key: port
    - parameter: userName
      name: producer-hangfire-pg-params
      key: username
    - parameter: password
      name: producer-hangfire-pg-params
      key: password
    - parameter: dbName
      name: producer-hangfire-pg-params
      key: database
    - parameter: sslmode
      name: producer-hangfire-pg-params
      key: sslmode
