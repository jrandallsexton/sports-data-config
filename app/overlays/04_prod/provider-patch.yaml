apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-football-ncaa-worker
  namespace: default
spec:
  # NO replicas here - scaled by KEDA (provider-football-ncaa-worker-scaler).
  # Setting it makes Flux reassert replicas: 1 every 5-minute reconcile and
  # fight the HPA, killing pods mid-job on every cycle.
  template:
    spec:
      containers:
      - name: provider-football-ncaa-worker
        image: sportdeets.azurecr.io/sportsdataprovider:6866
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
        resources:
          requests:
            memory: 1Gi
            cpu: "0.5"
          limits:
            memory: 2Gi
            cpu: "2"
