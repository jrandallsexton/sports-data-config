apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-football-ncaa-ingest
  namespace: default
spec:
  # 2026-08-30 MAINTENANCE HOLD (Mongo migration to the new NUC).
  # Ingest consumes DocumentRequested off RabbitMQ and drives document writes
  # into Mongo. Held at 0 so nothing sources mid-cutover. Messages accumulate
  # in RabbitMQ and drain normally on restore. RESTORE TO 1 AFTER CUTOVER.
  replicas: 0
  template:
    spec:
      containers:
      - name: provider-football-ncaa-ingest
        image: sportdeets.azurecr.io/sportsdataprovider:6673
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
