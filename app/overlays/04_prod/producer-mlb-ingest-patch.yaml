apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-baseball-mlb-ingest
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/reconcile: enabled
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: producer-baseball-mlb-ingest
        image: sportdeets.azurecr.io/sportsdataproducer:7828
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
