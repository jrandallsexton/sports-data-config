apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-football-nfl-worker
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/reconcile: enabled
spec:
  # NO replicas here - scaled by KEDA (producer-football-nfl-worker-scaler).
  # Setting it makes Flux reassert replicas: 1 every 5-minute reconcile and
  # fight the HPA, killing pods mid-job on every cycle.
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-03-29T14:45:00Z"
    spec:
      containers:
      - name: producer-football-nfl-worker
        image: sportdeets.azurecr.io/sportsdataproducer:6832
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
