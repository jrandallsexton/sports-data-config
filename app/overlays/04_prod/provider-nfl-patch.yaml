apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-football-nfl-worker
  namespace: default
spec:
  # NO replicas here - scaled by KEDA (provider-football-nfl-worker-scaler).
  # Setting it makes Flux reassert replicas: 1 every 5-minute reconcile and
  # fight the HPA, killing pods mid-job on every cycle.
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-03-29T15:30:00Z"
    spec:
      containers:
      - name: provider-football-nfl-worker
        image: sportdeets.azurecr.io/sportsdataprovider:6673
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
