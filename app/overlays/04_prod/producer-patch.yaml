apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-football-ncaa-worker
  namespace: default
spec:
  # NO replicas here. This deployment is scaled by the KEDA ScaledObject
  # producer-football-ncaa-worker-scaler. Setting it made Flux and the HPA
  # fight: every 5-minute reconcile reasserted replicas: 1, killing pods
  # mid-job, and the HPA immediately scaled back up ("Current number of
  # replicas below Spec.MinReplicas"). The base manifest already warns
  # "replicas managed by KEDA ScaledObject - do not set here"; this overlay
  # was quietly overriding it.
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-03-29T14:45:00Z"
    spec:
      containers:
      - name: producer-football-ncaa-worker
        image: sportdeets.azurecr.io/sportsdataproducer:6720
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
        resources:
          requests:
            memory: 1Gi
            cpu: "0.5"
          limits:
            memory: 2Gi
            cpu: "2"
