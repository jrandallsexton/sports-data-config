apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-football-nfl-api
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: provider-football-nfl-api
        image: sportdeets.azurecr.io/sportsdataprovider:7799
        env:
        - name: APPCONFIG_LABEL
          value: "Prod"
